# OpenMediaVault Compose deployment for retnd
# (WP4.3, deliverable D-8).
#
# Paste this into the File field of Services -> Compose -> Files -> Add in
# the OMV Workbench, and retnd.env into the Environment field.
#
# Tier C (§4A): a supported deployment profile, not an app-store package.
# There is deliberately no native OMV Workbench plugin, no navigation
# entry, no RPC service and no Debian package. §4A defers all of that, and
# distribution/packaging fails the build if any of it appears here.
#
# Every host path below is ${DISK}/..., so the one substitution an
# operator has to make (their real /srv/dev-disk-by-uuid-<UUID>/ path)
# happens once, in retnd.env, and this file needs no editing at
# all. Retained artifacts land in a directory of the app's own inside
# ${DISK}/backups rather than in that directory itself, so installing and
# removing this profile only ever touches paths it created.
#
# This is the same two-container shape container/compose.yaml already
# ships for the generic Docker app, using the exact same canonical image.
# Nothing here is OMV-specific behaviour.
# The compose project name, stated rather than inherited (issue #891,
# following container/compose.yaml). Compose defaults the project name to
# the directory this file happens to sit in, and the project name is the
# prefix of every default container name. With this line the containers
# are `retnd-retnd-1` and `retnd-web-ui-1` here exactly as they are in the
# canonical definition, so `docker ps` on an OMV box reads the same as
# `docker ps` on a generic Docker host and the documented names are true
# of both.
name: retnd

services:
  # The engine: local authentication, the versioned /api/v1 API and the
  # backup scheduler, one process sharing one shutdown context. Holds the
  # state database and the credentials. Publishes no port; reachable only
  # from web-ui over this project's own network.
  retnd:
    image: ${IMAGE:-ghcr.io/retnd/retnd:0.4.0}
    command: ["/retnd-web", "serve", "--profile=openmediavault"]

    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777,uid=${PUID:-1000},gid=${PGID:-100}

    environment:
      TMPDIR: "/tmp"
      # Retention is evaluated against calendar boundaries, so this is
      # not cosmetic: leaving it at the image's UTC default means the
      # days an operator reasons about and the ones the engine applies
      # are silently different.
      TZ: ${TZ:-UTC}
      # How loud both containers are (issue #730). Unset is `info`,
      # exactly what this stack has always emitted; `debug` adds the
      # per-request diagnostics - the engine's record of what it
      # served and the Web UI's trace of what the engine answered -
      # and the two containers' lines name the same correlation id, so
      # this belongs on both or neither. RETND_DEBUG=1 is the same
      # switch as the shortcut, and wins if both are set; RM_DEBUG=1
      # is its deprecated old name (issue #794). Derived from
      # container/compose.yaml; see docs/deployment.md.
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LISTEN_ADDR: ":8080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      # Safe here specifically because this container joins only the
      # private network below, whose only other member is the Web UI
      # container, so a forwarded header can only have come from that
      # proxy. Never set this on the Web UI container, which is the edge.
      TRUST_FORWARDED_HEADERS: "true"

    # Every host path derives from DISK, and DISK is written in the
    # fail-closed ${VAR:?message} form on purpose: an unset or misspelled
    # DISK stops the deployment instead of landing five bind mounts
    # somewhere plausible. Docker creates a missing bind-mount source, so
    # a fallback default here would put the backup root on the OS disk and
    # the config file would be created as a directory, which is the one
    # failure this profile exists to make impossible.
    #
    # The last three are the Host Workflow Runner's, and this profile
    # carries them because step 9 of
    # docs/acceptance/openmediavault-provider-acceptance.md tells the
    # administrator local hooks are AVAILABLE here: OMV is Debian with
    # systemd, so the runner installs onto the host beside this stack with
    # scripts/install/install_docker_host.py. Without these three the
    # engine has no socket to dial, no credential to present and no
    # scripts to read, so the runner could be installed and active and
    # every `NAME.local.sh` step would still be refused (issue #921).
    # They point under the same DISK prefix as everything else, which is
    # what --workflows-dir, --runtime-dir and the token path the installer
    # writes must be pointed at.
    #
    # Nothing here reaches the Docker daemon: docs/runtime-contract.md's
    # "this container gains nothing" still holds, and it is the RUNNER,
    # on the host, that holds the socket's group.
    volumes:
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/state:/data/state
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/backups/backupd:/data/backups
      # A writable directory holding config.yaml (issue #196): the
      # engine creates and atomically replaces that file, and its
      # ssh_keys/ and known_hosts.d/ stores are siblings of it.
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/config:/etc/retnd/config
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/secrets/id_ed25519:/etc/retnd/id_ed25519:ro
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/secrets/known_hosts:/etc/retnd/known_hosts:ro
      # The hook scripts, READ-ONLY: the engine executes what it reads
      # here, so a writable mount would be one compromised process away
      # from running anything on this host.
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/workflows:/workflows:ro
      # The runner's socket directory, and the only directory this
      # container writes for it: the engine dials
      # /data/run/workflow-runner.sock, which the runner creates.
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/run:/data/run
      # The runner's credential, one FILE and read-only, exactly like the
      # SSH key and known_hosts above: nothing in this container writes
      # it, and the rest of the secrets directory is not this container's
      # business.
      - ${DISK:?set DISK in retnd.env to your /srv/dev-disk-by-uuid-UUID path}/appdata/backupd/secrets/workflow-runner.token:/etc/retnd/workflow-runner.token:ro

    # The start gate, and a liveness question rather than a health
    # verdict (issue #206). The Web UI below declares
    # `depends_on: retnd: condition: service_healthy`, so
    # whatever this asks stands between an operator and the only
    # container with a published port. `/retnd status` is
    # FR-24's backup-freshness verdict and exits non-zero on any
    # DEGRADED, STALE or FAILING set, and on a fresh install, which has
    # backed nothing up yet: gating the Web UI on it means a new install
    # never gets a page at all.
    #
    # Declared here rather than inherited from the image, because the
    # image's own HEALTHCHECK is deliberately the freshness verdict: it
    # is the right default for a plain `docker run` and for the headless
    # `daemon` command, which serves no HTTP and so has no liveness
    # endpoint to ask. Backup freshness is not lost - read it with
    # `docker compose exec retnd /retnd status`, or let the
    # alerts block deliver it.
    #
    # Derived from container/compose.yaml, never authored here.
    healthcheck:
      test: ["CMD", "/retnd-web", "healthcheck", "--url", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    restart: unless-stopped
    # The grace period the runtime shuts down inside, declared rather
    # than left at Docker's own 10s default: the engine finishes the
    # transfer or the delete it is in the middle of, and a default is not
    # a contract.
    stop_grace_period: 30s
    networks:
      - internal

  # The Web UI: the shared static bundle plus a reverse proxy to the
  # engine. The only container with a published port, and the only URL an
  # operator ever opens. OMV has no navigation entry for it, by design;
  # see README.md.
  web-ui:
    image: ${IMAGE:-ghcr.io/retnd/retnd:0.4.0}
    command: ["/retnd-web", "serve-ui", "--profile=openmediavault"]

    depends_on:
      retnd:
        condition: service_healthy

    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=${PUID:-1000},gid=${PGID:-100}

    environment:
      TMPDIR: "/tmp"
      # Retention is evaluated against calendar boundaries, so this is
      # not cosmetic: leaving it at the image's UTC default means the
      # days an operator reasons about and the ones the engine applies
      # are silently different.
      TZ: ${TZ:-UTC}
      # The same switch as the engine's above, and it has to carry the
      # same value: at `debug` this container adds its reverse-proxy
      # trace, which is half of each request's story without the
      # engine's own line for it.
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LISTEN_ADDR: ":8080"
      UPSTREAM_ADDR: "http://retnd:8080"
      # The per-provider UI bundles the canonical image carries. With
      # `--profile=openmediavault` selected above, the bundle served is
      # /ui/bundles/openmediavault, so an operator who installed through this
      # platform's own mechanism sees that platform's bridge rather than
      # being told this is a generic Docker deployment (issue #180).
      UI_ROOT: "/ui/bundles"

    # No volumes at all: this container never reads config.yaml, the SSH
    # key, known_hosts, or either data directory. Every persistent path in
    # this profile is a bind mount to a host path you chose, so there is
    # no named volume for `docker compose down -v` to reach.

    # Overrides the image's own HEALTHCHECK, which runs
    # `/retnd status` and needs a config file and a state
    # database this container does not have. Without this override the
    # container runs correctly and reports unhealthy forever.
    healthcheck:
      test: ["CMD", "/retnd-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    ports:
      - "${WEB_PORT:-8080}:8080"

    restart: unless-stopped
    # Shorter than the engine's: the Web UI holds no state and has
    # nothing to finish.
    stop_grace_period: 15s
    networks:
      - internal

networks:
  internal:
