# Defaults for every question in questions.yaml. distribution/packaging
# fails the build if a question has no default here, or if this file
# declares a value no question asks for.
image:
  reference: "ghcr.io/retnd/retnd:0.5.1"

storage:
  state:
    hostPath: "/mnt/tank/retnd/state"
  backups:
    hostPath: "/mnt/tank/retnd/backups"
  configDir:
    hostPath: "/mnt/tank/retnd/config"
  sshKey:
    hostPath: "/mnt/tank/retnd/secrets/id_ed25519"
  knownHosts:
    hostPath: "/mnt/tank/retnd/secrets/known_hosts"

network:
  webPort: 8080

runtime:
  puid: 568
  pgid: 568
  timezone: "UTC"
