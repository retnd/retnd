# workflows.root must be an absolute path (validateWorkflows ->
# validAbsolutePath). A relative root cannot be a trust boundary: every
# stage directory has to resolve inside it, and a relative path resolves
# differently depending on whatever working directory the daemon happens
# to have started with.
poll_interval: 15m

state:
  database: /var/lib/backupd/state.db

workflows:
  root: workflows

sources:
  - id: production
    backup_sets:
      - id: postgres-primary
        remote:
          type: local
        remote_path: /srv/exports/postgres
        local_path: /backups/production/postgres
        completion:
          strategy: stable
          stable_for: 10m
        stale_after: 30h

retention:
  timezone: UTC
  week_starts_on: monday
  daily_days: 7
  weekly_months: 3
  monthly_months: 12
  protect_last_known_good: true
