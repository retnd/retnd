# #808's split, pinned: a hook directory that is configured but MISSING
# from disk is not a config-validation error. workflows.go's package doc
# explains why -- a daemon must not refuse to start because its
# /workflows mount happens to be late -- so this is left to
# internal/workflow's Snapshot, at run start, where the refusal becomes a
# failed backup an operator can see rather than a daemon that will not
# come up. This fixture's before_dir names a directory that exists
# nowhere on this filesystem and must still validate here.
poll_interval: 15m

state:
  database: /var/lib/backupd/state.db

workflows:
  root: /workflows
  global:
    before_dir: this-directory-does-not-exist/before.d

sources:
  - id: production
    backup_sets:
      - id: postgres-primary
        remote:
          type: local
        remote_path: /srv/exports/postgres
        local_path: /backups/production/postgres
        completion:
          strategy: stable
          stable_for: 10m
        stale_after: 30h

retention:
  timezone: UTC
  week_starts_on: monday
  daily_days: 7
  weekly_months: 3
  monthly_months: 12
  protect_last_known_good: true
