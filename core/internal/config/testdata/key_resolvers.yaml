poll_interval: 15m

state:
  database: /var/lib/retnd/state.db

sources:
  - id: production
    backup_sets:
      - id: postgres-primary
        remote:
          type: sftp
          host: production.example.internal
          user: backup
          key:
            command: ["/usr/local/bin/op", "read", "op://infra/retnd/private-key"]
          known_hosts: /etc/retnd/known_hosts
        remote_path: /backups/postgres
        local_path: /backups/production/postgres
        completion:
          strategy: stable
          stable_for: 10m
        stale_after: 30h
