<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 122.2 48" width="122.2" height="48" role="img" aria-label="retnd">
  <!-- THE retnd logo, and the only one. Light and dark, the mark alone, the
       wordmark alone and every raster in the tree all come from this file
       (docs/design/brand-assets.md).

       One file, three jobs, and what makes each work:

       ADAPTS. Everything is painted with currentColor, and the two theme
       groups at the bottom set `color` from prefers-color-scheme. Nothing
       inside <defs> carries a colour of its own, so whoever instantiates a
       part decides what it looks like, and the default render follows the
       reader's colour scheme with no second file.

       SCALES. Every shape is a path or a circle in the 48-unit grid of the
       mark, stroked in that grid's units, so a stroke grows and shrinks with
       the artwork. There is no non-scaling stroke, no hairline, no raster
       and no font: the name is geometry, not a text node (FR-44, #893).

       SPLITS. <defs> holds two groups, and a consumer picks the one it
       needs:
         #mark       the broken ring, viewBox "0 0 48 48"
         #wordmark   the name, ink box "58.5 14.5 59.2 19" in the same grid
       Both are laid out in the lockup's own coordinates, so a consumer
       gives its own <svg> the viewBox above, sets `color`, and instantiates
       the group with <use href="logo.svg#mark"/>. The default render below
       is the two of them side by side.

       THE MARK, unchanged: a broken ring reading as a transfer cycle in
       progress (Option 1a "Cycle", docs/design/Logo Options.dc.html).

       THE WORDMARK, drawn: monoline, stroke 3 with round caps and joins,
       which is the mark's own drawing language. Baseline y=32, x-height 11.4
       (y=20.6), ascender 16 (y=16), glyph centreline width 8, left edges at
       x = 60, 70.8, 83.2, 95.6, 108.2. The construction and the 16px
       decision are in docs/design/brand-assets.md and
       docs/design/893-16px-wordmark-or-monogram.html.

       THE TRAILING d is the one glyph in the muted tone, as it has been
       since the name's first lockup. It is the same ink at half strength
       rather than a second colour: that reads as the old #8b8d8a on white
       and #767976 on black, and it stays a muted version of whatever the
       wordmark is set in on any ground, which a second fixed colour cannot
       do once the wordmark is split out and recoloured. -->
  <defs>
    <style>
      .retnd-mark-theme { color: #446b9c; }
      .retnd-wordmark-theme { color: #191a19; }

      @media (prefers-color-scheme: dark) {
        .retnd-mark-theme { color: #ffffff; }
        .retnd-wordmark-theme { color: #eceeeb; }
      }
    </style>

    <g id="mark">
      <circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="47 20" transform="rotate(-52 24 24)"/>
      <circle cx="24" cy="24" r="5.5" fill="currentColor"/>
    </g>

    <g id="wordmark" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M60 32V24.6A4 4 0 0 1 64 20.6H67.4"/>
      <path d="M70.8 26.3H78.8M78.8 26.3A4 5.7 0 1 0 76.8 31.24"/>
      <path d="M83.2 20.6H91.2M86.56 16V29A3 3 0 0 0 89.56 32"/>
      <path d="M95.6 32V24.6A4 4 0 0 1 103.6 24.6V32"/>
      <path d="M116.2 16V32M116.2 26.3A4 5.7 0 1 0 108.2 26.3A4 5.7 0 1 0 116.2 26.3" stroke-opacity=".5"/>
    </g>
  </defs>

  <g class="retnd-mark-theme">
    <use href="#mark" xlink:href="#mark"/>
  </g>
  <g class="retnd-wordmark-theme">
    <use href="#wordmark" xlink:href="#wordmark"/>
  </g>
</svg>
