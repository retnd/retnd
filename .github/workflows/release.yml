name: Release

# Issue #88 (B5.2), docs/EPIC-B-multi-nas.md §61 and §62, retriggered by
# issue #259.
#
# The release pipeline: regenerate the compliance artifacts inside the
# build, prove they are what is committed, prove the release manifest
# describes what this tree builds, then build and push the canonical
# multi-architecture image, sign it keylessly and attest its SBOM.
#
# WHAT PUBLISHES, AND WHY THAT IS SAFE
#
# A push to `release` publishes. That is a change from this file's first
# version, which was workflow_dispatch-only and argued the case in this
# same paragraph, so here is what changed rather than a comment left
# contradicting the file underneath it.
#
# The original reasoning was that this workflow puts a semantic version in
# a public registry, which is not a thing that is taken back cleanly, so
# it should only ever run because a person meant it to. That is still
# true. What changed is what counts as a person meaning it. A typed
# confirmation input was the only deliberate act a dispatch-only workflow
# could observe; merging to `release` is a stronger one, because it has a
# reviewable diff, an author and an audit trail that a dispatch input
# never had. docs/release-branch.md is what makes that hold: `release` is
# append-only, nothing is branched off it, and only a release cut lands on
# it.
#
# workflow_dispatch stays, with `publish` and `confirm` intact, because a
# dry run against the real tree is worth having and is how a cut gets
# checked before it is made. The two paths must not disagree about what
# gets published: a push-triggered run that quietly used `publish: false`
# would be a pipeline that looks like it released and did not, which is
# worse than either behaviour on its own. So exactly one expression
# decides, in the `decide` job below, and every other job reads its
# output.
#
# Neither path publishes off `release`. The dispatch input is a request,
# not a permission: `decide` checks the ref first and refuses to publish
# from anywhere else, whatever the input says. Without that, one dispatch
# aimed at a feature branch pushes and signs an image under that branch's
# OIDC identity, which the compliance record does not describe and the
# documented verification command rejects.
#
# WHAT CHECKS THE CODE BEFORE IT GETS HERE. Not the jobs below.
# Everything under compliance-artifacts and publish proves the compliance
# artifacts and the manifest parity, which is a different question from
# whether the product works, and by the time it runs the merge has already
# happened. The pre-commit hook running scripts/ci-local.sh is the only
# gate for that, for `main` and for releases alike (#1260): GitHub Actions
# gates nothing here any more, ci.yml is gone, and nothing on this side
# produces a check run that could be mistaken for a gate.
#
# What this workflow does check is that the gate ran, in full, on the
# tree it is about to publish. Release prep runs
# scripts/release/record-local-gate.sh last, which runs the full gate in a
# clean detached worktree and writes provenance/local-gate.json and
# provenance/local-gate.log; the require-release-gate job below reads that
# record off the commit being published, recomputes the tree it describes
# with scripts/release/gate-tree.sh, and refuses `publish` on a mismatch,
# a missing record, an INCOMPLETE run, a schema it does not read, or a Go
# that is not the one this file builds with. A direct push, a merge of a
# tree nobody ran the gate on, or main moving after the record was written
# all stop here instead of shipping. Its own header has the design and the
# escape hatch.
#
# THE RECORD IS SELF-ASSERTED, and this file says so rather than implying
# otherwise. Anyone with push rights can write a JSON file, the same way
# they could once dispatch ci.yml by hand on any ref. What stands against
# a forged record is review of the prep pull request, where the record
# and its log arrive as a diff, plus the log itself: the record hashes it,
# github-release attaches it, and forging it means forging twenty-five
# minutes of output rather than one line. Commit signing on the prep
# commit is the upgrade path if that is ever not enough.
#
# There is no signing key here and none should ever be added. The signature
# is keyless: the job's own OIDC token is exchanged for a short-lived
# Fulcio certificate bound to this workflow's identity, which is what
# provenance/release-provenance.json records under signing.identity, and
# what a verifier pins. id-token: write is the whole credential story.
# docs/compliance/release-provenance.md has the design and the fallback for
# a release signed by hand.
#
# THE TRIGGER BELOW IS PART OF THAT IDENTITY. GitHub builds the certificate
# SAN out of the ref the run was triggered on, so the "on:" block decides
# what a verifier has to pin: publishing on a push to `release` signs as
# @refs/heads/release. Changing the trigger changes the identity of every
# release signed afterwards, and the documented `cosign verify` command has
# to change with it. That command lives in distribution/packaging/signing.go
# and TestSigningIdentityMatchesTheWorkflowTriggerThatPublishes reads this
# file to hold the two together, because for a while they disagreed and the
# published command reported a genuinely signed image as unverifiable
# (issue #510).

on:
  push:
    branches:
      - release
    # A commit that ONLY records what the build above just produced --
    # container/release-manifest.json's digests, canonical.json's
    # published flag, the installer's CARRIED_RELEASE_DIGEST, and the
    # provenance/ bundle those three feed -- must not trigger a second
    # publish. It did, twice, before this existed: recording 0.4.0's
    # digests pushed a metadata-only commit to `release`, which rebuilt
    # and re-pushed under the same tag, producing a DIFFERENT digest
    # (OCI image digests are not reproducible across separate buildx
    # invocations on this project's toolchain, the same non-determinism
    # verify-manifest-parity.sh's binary_sha256 check already found and
    # scripts/release/record-release-hashes.sh already has to be re-run
    # against), which then needed recording again, which would have
    # triggered a third. Ignoring these paths on the push trigger is what
    # actually stops that: a commit that touches only them settles here
    # rather than looping.
    paths-ignore:
      - "container/release-manifest.json"
      - "distribution/packaging/canonical.json"
      - "provenance/**"
      - "scripts/install/install_docker_host.py"
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to the registry. Leave false to run the whole pipeline without publishing."
        type: boolean
        default: false
      confirm:
        description: "Type the image tag being published (for example 0.1.0) to confirm. Ignored when publish is false."
        type: string
        default: ""
      tag_latest_for:
        description: "Re-point ghcr.io/retnd/retnd:latest at an already published version (for example 0.6.4), without building or publishing anything. Refuses a version with no published image, one whose digest differs from container/release-manifest.json, and one that is not the highest release. Leave empty for a normal run."
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The single place publishing is decided, so the push path and the
  # dispatch path cannot drift into disagreeing. A push to `release` is
  # itself the confirmation; a dispatch says so with its own input and is
  # separately made to type the tag below.
  decide:
    name: decide whether this run publishes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      repoint: ${{ steps.decide.outputs.repoint }}
    steps:
      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_REPOINT: ${{ inputs.tag_latest_for }}
        run: |
          # The ref gate comes before everything else, and it is not about
          # the event. workflow_dispatch can be aimed at any branch, so
          # `publish: true` from a feature branch would push, sign and
          # attest an image whose OIDC identity is that branch's ref. That
          # is not the identity provenance/release-provenance.json records
          # and not one the documented `cosign verify` accepts, so it puts
          # an image in a public registry that this project's own
          # compliance record does not vouch for, one click away and with
          # no reviewable diff behind it. A run off `release` still builds
          # and still runs every check; it just cannot publish (#510).
          publish=false
          if [ "$GITHUB_REF" != "refs/heads/release" ]; then
            echo "This run is on ${GITHUB_REF}. Only refs/heads/release publishes, so everything is built and checked and nothing is pushed, signed or attested." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT_NAME" = "push" ]; then
            publish=true
            echo "A push reached the release branch, so this run publishes." >> "$GITHUB_STEP_SUMMARY"
          else
            publish="${INPUT_PUBLISH:-false}"
            echo "Dispatched on the release branch with publish=${publish}." >> "$GITHUB_STEP_SUMMARY"
          fi
          # A latest re-point (#1168) is its own kind of run: it builds
          # nothing, publishes nothing and signs nothing, so it forces
          # publish to false whatever else was typed. require-release-gate
          # and compliance-artifacts skip on it, which skips publish and
          # everything downstream of publish, and repoint-latest is the one
          # job left standing.
          repoint=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_REPOINT:-}" ]; then
            repoint=true
            publish=false
            echo "Re-pointing latest at ${INPUT_REPOINT}. Nothing is built, pushed, signed or attested." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "repoint=${repoint}" >> "$GITHUB_OUTPUT"

  # Did anything actually check this commit before it got here?
  #
  # Issue #575 put the full suite in front of a release as a required
  # check on a pull request into `release`, and this job used to ask
  # GitHub whether that check run passed. #1260 made the pre-commit hook
  # the only gate and deleted ci.yml, so there is no check run to ask
  # about, and the question moved into the repository itself: release
  # prep runs scripts/release/record-local-gate.sh, which runs the full
  # gate in a clean detached worktree at HEAD and writes
  # provenance/local-gate.json (the record) and provenance/local-gate.log
  # (the gate's own output), and this job reads them off the commit it is
  # about to publish.
  #
  # WHAT IT COMPARES. The record names `gate_tree`: the tree hash of the
  # commit the gate ran on, with exactly those two files left out, worked
  # out by scripts/release/gate-tree.sh with git alone. This job runs the
  # SAME script over GITHUB_SHA and refuses unless the hashes agree. Trees,
  # not commits, on purpose: the release pull request lands as GitHub's
  # own merge commit, which no hook ever ran on, and its tree is main's
  # tree whenever release is an ancestor of main (which merge-back-to-main
  # keeps true). If anything landed on main after the record was written,
  # the hashes differ and the refusal names both, and the fix is to re-run
  # the recorder on the current tip. Only the record and its log are left
  # out of the hash. release.yml's paths-ignore list is wider (the manifest,
  # canonical.json, the installer, all of provenance/), and leaving THOSE
  # out would let installer code and release data change after the gate
  # ran, so release prep writes the record last and everything before it is
  # inside the hash.
  #
  # WHAT ELSE IT REFUSES. A record of an INCOMPLETE run (a ledger that is
  # not empty, or a result that is not ok), which the recorder never
  # writes, so one here was written by hand. A schema it does not read,
  # by name, so a format change is a refusal and not a misreading. A log
  # whose hash is not the record's. And a recorded Go whose major.minor is
  # not the `go-version` this file installs: a patch release of the same
  # Go is the same language and the same standard library, and refusing on
  # it would hold every release for a toolchain upgrade to match a pin to the
  # digit, but a different minor is a different compiler and the run that
  # was green is not the run that ships.
  #
  # WHAT IT PROVES, PRECISELY: that somebody with push rights ran the full
  # suite on these bytes, on their machine, and it passed. Not that
  # anybody reviewed it, and not that the record is true. It is
  # self-asserted, and the header of this file says what stands against a
  # forged one: review of the prep pull request, and the log. Whether a
  # second person looked is the pull request rule's question, and the
  # ruleset is what answers it.
  #
  # THE ESCAPE HATCH IS A COMMIT TRAILER: `Release-Gate-Override: <why>`
  # on the commit being published, with a reason of at least twelve
  # characters. A release process with no override is a release process
  # people route around, and the route around this one is deleting the
  # job. A trailer beats a dispatch input here for the same reason a merge
  # beats a typed string: `release` is append-only, so the override and
  # its reason sit in the published history for good, next to the commit
  # they excused, while a dispatch input lives in a run log that ages out.
  # It also cannot be added after the fact, and that is the point rather
  # than a limitation. Overriding is a decision made while cutting, not a
  # button found afterwards.
  #
  # It changes nothing about signing. This job holds no id-token and no
  # packages scope and pushes nothing; `publish` below is still the only
  # job that reaches a registry, on the same push to `release` it always
  # did. The Fulcio certificate still says
  # .github/workflows/release.yml@refs/heads/release and the documented
  # `cosign verify` command is untouched.
  #
  # scripts/tests/release-refuses-an-ungated-publish.test.sh pulls the
  # script below out of this file and runs it in throwaway repositories,
  # once per outcome worth having: green, missing, a different tree, an
  # INCOMPLETE ledger, the wrong Go, an unknown schema, not JSON, a log
  # that does not match, overridden, and overridden with no reason given.
  # scripts/tests/local-gate-record.test.sh runs the recorder and then
  # this script over what it wrote, so the writer and the reader are
  # proven to agree.
  require-release-gate:
    name: the release gate passed on what this publishes
    needs: decide
    if: needs.decide.outputs.repoint != 'true'
    runs-on: ubuntu-latest
    permissions:
      # Reading the checkout, and nothing else. No id-token, no packages:
      # this job decides whether `publish` may run and publishes nothing
      # of its own.
      contents: read
    steps:
      # A plain checkout is enough: gate-tree.sh loads the published
      # commit's own tree into a temporary index, which needs no history.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refuse to publish a commit the local gate never recorded
        # Through env, never through a ${{ }} expansion inside the script,
        # for the reason the confirmation step below spells out: an
        # expansion is pasted into the shell source before bash parses it.
        env:
          PUBLISH: ${{ needs.decide.outputs.publish }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys

          RECORD = "provenance/local-gate.json"
          LOG = "provenance/local-gate.log"
          GATE_TREE = "scripts/release/gate-tree.sh"
          WORKFLOW = ".github/workflows/release.yml"
          SCHEMA = "retnd.local-gate/1"
          TRAILER = "Release-Gate-Override:"
          MIN_REASON = 12

          sha = os.environ.get("GITHUB_SHA", "")
          publish = os.environ.get("PUBLISH", "")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")


          def emit(lines):
              text = "\n".join(lines)
              print(text)
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as fh:
                      fh.write(text + "\n")


          def refuse(title, lines):
              emit(["## release gate: REFUSED", ""] + lines)
              print("::error title=" + title + "::" + lines[0])
              sys.exit(1)


          def allow(heading, lines):
              emit(["## " + heading, ""] + lines)
              sys.exit(0)


          # The inputs first, and an unrecognised one refuses. Reading
          # anything that is not "true" as "this run does not publish"
          # would turn a renamed output into a gate that waves everything
          # through while still reporting green, which is the failure this
          # job exists to stop wearing this job's own uniform.
          if publish not in ("true", "false"):
              refuse(
                  "release gate cannot tell whether this run publishes",
                  [
                      "`decide` handed this job publish=" + repr(publish) + ", which is neither `true` nor `false`.",
                      "",
                      "Every publishing step reads that output. If it has been renamed or dropped, this job cannot tell a dry run from a release, so it refuses rather than guess the answer that happens to look safe.",
                  ],
              )

          if publish == "false":
              allow(
                  "release gate: nothing to gate",
                  [
                      "`decide` says this run publishes nothing, so there is no image and no signature at the end of it. Everything below runs on the publishing path only.",
                  ],
              )

          if not sha:
              refuse(
                  "release gate does not know what it is looking at",
                  ["GITHUB_SHA is empty, so there is no commit to read the record off."],
              )


          def git(*args):
              proc = subprocess.run(["git", *args], capture_output=True, text=True)
              return proc.returncode, proc.stdout, proc.stderr


          def show(path):
              """The file at `path` IN THE PUBLISHED COMMIT, or None. Read
              with git rather than from the working tree, so a record
              dropped into the checkout by anything after the push is
              not the record this job reads."""
              code, out, _ = git("show", sha + ":" + path)
              return out if code == 0 else None


          # The override trailer, read off the commit being published and
          # nothing else. A trailer in a commit this one merged in is not
          # an override: what counts is the message written at the moment
          # the release landed.
          code, message, err = git("log", "-1", "--format=%B", sha)
          if code != 0:
              refuse(
                  "release gate could not read the commit",
                  ["`git log -1 " + sha + "` failed:", "", "```", err.strip() or "(no output)", "```"],
              )
          override = ""
          override_without_reason = False
          for line in message.splitlines():
              stripped = line.strip()
              if not stripped.startswith(TRAILER):
                  continue
              reason = stripped[len(TRAILER):].strip()
              if len(reason) >= MIN_REASON:
                  override = reason
              else:
                  override_without_reason = True

          # The checks, in the order a reader would want them explained.
          # Every one appends to `findings`, and the first refusal wins
          # the title; all of them are reported, so a record that is wrong
          # in three ways is fixed in one round.
          findings = []
          report = []

          raw = show(RECORD)
          record = None
          if raw is None:
              findings.append("`" + RECORD + "` is not in the commit being published (`" + sha[:12] + "`): nothing recorded a gate run on this tree.")
          else:
              try:
                  record = json.loads(raw)
              except ValueError as exc:
                  findings.append("`" + RECORD + "` is not JSON (" + str(exc) + "), so there is no record in it to read.")
                  record = None
              if record is not None and not isinstance(record, dict):
                  findings.append("`" + RECORD + "` is JSON but not an object, so there is no record in it to read.")
                  record = None

          if record is not None:
              schema = str(record.get("schema", ""))
              if schema != SCHEMA:
                  findings.append("the record's schema is `" + (schema or "(missing)") + "` and this job reads `" + SCHEMA + "`. A format this job does not know is a refusal, not a guess.")
              else:
                  report.append("- schema `" + SCHEMA + "`")

              result = str(record.get("result", ""))
              ledger = record.get("ledger")
              if result != "ok":
                  findings.append("the record's result is `" + (result or "(missing)") + "`, not `ok`. The recorder never writes a record for a run that was not ok, so this one was written by hand.")
              if not isinstance(ledger, list):
                  findings.append("the record carries no ledger list at all, so nothing says the run was complete.")
              elif ledger:
                  findings.append("the record's ledger is not empty, so the run it describes was INCOMPLETE and is not merge evidence. It did not run:\n" + "\n".join("    - " + str(item) for item in ledger))
              else:
                  report.append("- result `ok`, ledger empty")

              recorded_tree = str(record.get("gate_tree", ""))
              code, out, err = git("rev-parse", "--verify", "--quiet", sha + "^{tree}")
              if code != 0:
                  findings.append("`" + sha + "` does not name a commit in this checkout, so there is no tree to compare the record against.")
              else:
                  proc = subprocess.run(["bash", GATE_TREE, sha], capture_output=True, text=True)
                  published_tree = proc.stdout.strip()
                  if proc.returncode != 0 or not re.fullmatch(r"[0-9a-f]{40}", published_tree):
                      findings.append("`" + GATE_TREE + "` could not compute the published commit's gate tree:\n```\n" + (proc.stderr.strip() or proc.stdout.strip() or "(no output)") + "\n```")
                  elif recorded_tree != published_tree:
                      findings.append(
                          "the record describes a different tree. Recorded `" + (recorded_tree or "(missing)") + "`, and the commit being published is `" + published_tree + "` with the record and its log left out. "
                          "Something landed between the recorder's run and this cut, or the record was written somewhere else; re-run `bash scripts/release/record-local-gate.sh` on the tip that is being released."
                      )
                  else:
                      report.append("- gate_tree `" + published_tree + "` matches the published commit")

              log_body = show(LOG)
              recorded_log = str(record.get("log_sha256", ""))
              if log_body is None:
                  findings.append("`" + LOG + "` is not in the commit being published, so the record's log_sha256 points at nothing a reader can open.")
              else:
                  actual = hashlib.sha256(log_body.encode("utf-8")).hexdigest()
                  if actual != recorded_log:
                      findings.append("the committed log does not match the record: log_sha256 is `" + (recorded_log or "(missing)") + "` and `" + LOG + "` hashes to `" + actual + "`. One of them was edited after the run.")
                  else:
                      report.append("- log `" + LOG + "` hashes to the recorded `" + actual[:12] + "...`")

              recorded_go = str((record.get("tools") or {}).get("go", ""))
              pins = []
              try:
                  with open(WORKFLOW, encoding="utf-8") as fh:
                      pins = re.findall(r'^\s*go-version:\s*"([^"]+)"', fh.read(), re.MULTILINE)
              except OSError:
                  pass
              if not pins:
                  findings.append("`" + WORKFLOW + "` declares no `go-version`, so this job cannot tell whether the recorded Go is the one that builds the release.")
              elif len(set(pins)) != 1:
                  findings.append("`" + WORKFLOW + "` declares more than one `go-version` (" + ", ".join(sorted(set(pins))) + "); they have to agree before this job can compare a record against them.")
              else:
                  pin = pins[0]
                  pin_minor = ".".join(pin.split(".")[:2])
                  got_minor = ".".join(recorded_go.removeprefix("go").split(".")[:2])
                  if not recorded_go.startswith("go") or got_minor != pin_minor:
                      findings.append("the record was made with Go `" + (recorded_go or "(missing)") + "` and release.yml builds with go-version `" + pin + "`. Same major.minor is required; a different compiler means the run that was green is not the run that ships.")
                  else:
                      report.append("- Go `" + recorded_go + "` matches release.yml's go-version `" + pin + "` at major.minor")

          if not findings:
              allow(
                  "release gate: PASSED",
                  ["`" + RECORD + "` on `" + sha[:12] + "` records a full green run of scripts/ci-local.sh on exactly this tree.", ""] + report,
              )

          trouble = ["I checked the local-gate record on `" + sha[:12] + "` and found:", ""] + ["- " + f for f in findings]
          if report:
              trouble += ["", "What did hold:", ""] + report

          if override_without_reason and not override:
              refuse(
                  "release gate override carries no reason",
                  [
                      "The commit being published has a `" + TRAILER + "` trailer with nothing usable after it, and the local-gate record does not pass.",
                      "",
                      "An override needs a reason of at least " + str(MIN_REASON) + " characters, because the reason is the whole audit trail. `release` is append-only, so what is written there is what somebody reads a year from now when they ask why this release skipped its own gate.",
                      "",
                  ]
                  + trouble,
              )

          if override:
              print("::warning title=release gate overridden::" + override)
              allow(
                  "release gate: OVERRIDDEN",
                  [
                      "The local-gate record does not pass on this commit, and the commit carries a `" + TRAILER + "` trailer, so this run publishes anyway.",
                      "",
                      "> " + override,
                      "",
                      "This is the deliberate escape hatch, and it is not a quiet one. The trailer stays in the history of `release` for good, so this paragraph is permanent. If the reason for it has since gone away, the next cut should not carry it.",
                      "",
                  ]
                  + trouble,
              )

          refuse(
              "nothing checked the commit this run would publish",
              [
                  "This run publishes a signed image to a public registry, and no full green run of the local gate is recorded on what it would publish.",
                  "",
              ]
              + trouble
              + [
                  "",
                  "The way through is release prep: on the `main` tip being released, with a clean tree and the hook installed, run `bash scripts/release/record-local-gate.sh`, commit `" + RECORD + "` and `" + LOG + "` with the prep, and cut the release from that. If this is a real emergency, put `" + TRAILER + " <why>` in the message of the merge commit and it publishes, loudly and permanently on the record. docs/release-workflow.md has the rest.",
              ],
          )
          PY

  compliance-artifacts:
    name: compliance artifacts are what this tree generates
    needs: decide
    if: needs.decide.outputs.repoint != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The provenance bundle pairs itself with the release manifest's
          # commit, and the manifest's own ancestry check is unanswerable
          # in a shallow clone: git exits 128 and the check correctly
          # reports that it could not decide (#174).
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true
          cache-dependency-path: distribution/go.mod

      # This is what makes drift structurally impossible rather than
      # merely loud, which is the half #174 left open. The release
      # regenerates the compliance record from the tree it is about to
      # build, and refuses to continue if the result differs from what is
      # committed. A release cannot ship an SBOM describing a different
      # dependency graph, because the release is what produced the SBOM.
      - name: Regenerate
        working-directory: distribution
        env:
          GOWORK: "off"
        run: go run ./cmd/provenance -write

      - name: Refuse a release whose committed artifacts are not what it generates
        run: |
          if ! git diff --exit-code -- NOTICE provenance/; then
            echo "::error::the committed compliance artifacts are not what this tree generates. Run (cd distribution && go run ./cmd/provenance -write) and commit the result."
            exit 1
          fi

      - name: Verify the checksum manifest against the tree
        run: sha256sum -c provenance/checksums.txt

      - name: Supply-chain and compliance suite
        working-directory: distribution
        env:
          GOWORK: "off"
        run: go test ./packaging/ -count=1

      - name: Upload the release's compliance bundle
        uses: actions/upload-artifact@v7
        with:
          name: compliance-bundle
          path: |
            LICENSE
            NOTICE
            provenance/
            container/release-manifest.json
          if-no-files-found: error

  publish:
    name: build, push, sign and attest
    needs: [decide, require-release-gate, compliance-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The entire signing credential. No key, no secret, nothing stored.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # After the checkout, because it reads canonical.json. A dispatch
      # that types the wrong tag is stopped here rather than by the
      # script's own guards, which check a different thing: those ask
      # whether this tree may be published at all, this asks whether the
      # person dispatching meant to publish this version.
      #
      # Only on the dispatch path. A push to `release` needs no typed
      # string, because reaching that branch is the deliberate act the
      # string was standing in for, and asking for it again would make
      # the merge conditional on something no merge can supply.
      #
      # The dispatcher's string arrives through env, never through a
      # ${{ }} expansion inside the script. An expansion is textual: it
      # is pasted into the shell source before bash parses it, so the
      # value being compared would be shell syntax rather than data, in
      # the one job that holds id-token: write (the Sigstore identity
      # Fulcio certifies) and packages: write. A confirmation step whose
      # input can rewrite the step is not a confirmation.
      - name: Refuse an unconfirmed publish
        if: github.event_name == 'workflow_dispatch' && needs.decide.outputs.publish == 'true'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          tag="$(sed -n 's/.*"tag"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' distribution/packaging/canonical.json | head -n1)"
          if [ "$CONFIRM" != "$tag" ]; then
            echo "::error::publish is true and confirm is '${CONFIRM}', which is not the tag canonical.json declares ('${tag}'). Type the tag to confirm."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        if: needs.decide.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Log in to ghcr.io
        if: needs.decide.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the compliance bundle
        uses: actions/download-artifact@v8
        with:
          name: compliance-bundle

      # Unconditional, on both paths, and before the push rather than
      # beside it (#260). The old guard 2 asked whether the manifest's
      # commit equalled HEAD, which no tree can satisfy and which would
      # not have answered the real question anyway. This rebuilds each
      # architecture and hashes the two binaries out of the image, so a
      # release cannot ship a manifest describing different bytes. Running
      # it on a `publish: false` dispatch is the point: that is the run
      # whose whole job is to find this out before the registry does.
      - name: Prove the release manifest describes what this tree builds
        run: bash scripts/release/verify-manifest-parity.sh

      # DRY_RUN=1 runs every guard and stops before the push, so a
      # dispatch with publish left false still exercises the refusals
      # against the real tree rather than only against fixtures.
      #
      # Nothing in this file names a package: the GHCR path comes from
      # distribution/packaging/canonical.json's image block, and the run
      # pushes exactly image.reference. The one-release mirror under the old
      # package path (FR-39) is gone: its organisation no longer exists, so
      # the second push failed AFTER the first had landed and left 0.5.0 in
      # the registry unsigned.
      - name: Publish
        env:
          DRY_RUN: ${{ needs.decide.outputs.publish == 'true' && '0' || '1' }}
        run: bash scripts/release/publish-image.sh

  # A release is not complete when the push returns. The registry is the
  # authority for the index and platform digests, and main must record those
  # facts together with image.published=true, the installer pin and regenerated
  # provenance. This job performs that whole transition after the publish job
  # has pushed, signed and attested every declared package path.
  #
  # It merges the published release commit with --no-commit, reads the image
  # back from GHCR, records the resulting immutable identities, runs the
  # consistency guards, then creates one merge commit containing both the
  # release ancestry and its post-publish metadata. A conflict or inconsistent
  # registry response fails rather than guessing. Re-running a completed
  # workflow is harmless: when the published SHA is already in main and the
  # generated files are unchanged, there is nothing to commit or push.
  merge-back-to-main:
    name: merge release into main, now that it has published
    needs: [decide, publish]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the published source without committing yet
        env:
          PUBLISHED_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor "$PUBLISHED_SHA" HEAD; then
            echo "Published commit is already reachable from main; regenerating metadata to prove this retry is a no-op."
          else
            git merge --no-ff --no-commit "$PUBLISHED_SHA"
          fi

      - name: Read the published image reference
        id: image
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          image = json.loads(Path("distribution/packaging/canonical.json").read_text())["image"]
          print(f"tag={image['tag']}")
          print(f"reference={image['reference']}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record what GHCR holds
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          index_digest="$(docker buildx imagetools inspect "$REFERENCE" --format '{{.Manifest.Digest}}')"
          docker buildx imagetools inspect "$REFERENCE" --raw > "$RUNNER_TEMP/release-index.json"
          python3 scripts/release/record-published-release.py \
            --index-digest "$index_digest" \
            --index-manifest "$RUNNER_TEMP/release-index.json"
          {
            echo "### Published registry identity"
            echo
            echo "\`$REFERENCE@$index_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: |
            core/go.sum
            distribution/go.sum

      - name: Regenerate and verify published release records
        run: |
          (cd distribution && go run ./cmd/provenance -write)
          (cd distribution && go test ./packaging -count=1)
          (cd distribution && go run ./cmd/provenance)
          python3 scripts/install/test_install_docker_host.py
          bash scripts/release/check-published-provenance.sh
          sha256sum -c provenance/checksums.txt
          # The deployment tripwire, before the push and not after it
          # (#1247). The recorder moved canonical.json's line in its
          # digests.txt with the publish; anything else that moved is a
          # deployment change nobody reviewed, and main must not get it.
          (cd core && go test ./tests/deploymentdiff/ -count=1)

      - name: Commit the release and registry facts to main
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          git add -A
          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ]; then
            echo "main already records release ${TAG}; nothing to push."
            exit 0
          fi
          git commit \
            -m "Merge release into main after publishing ${TAG}" \
            -m "Automated by .github/workflows/release.yml after reading the index and platform digests back from GHCR, updating the installer pin and the deployment digest of canonical.json, and regenerating the provenance bundle."
          git push origin HEAD:main

  # ---- the latest tag (issue #1168) --------------------------------------
  #
  # ghcr.io/retnd/retnd:latest is for humans and quick pulls. Compose files,
  # the installer and the docs keep pinning the version's index digest, and
  # docs/install.md says latest is not to be installed from.
  #
  # Both jobs below are scripts/release/latest.sh and nothing else: the rule
  # (latest only ever moves to the highest non-prerelease release, so a 0.5.x
  # backport or a prerelease never takes it), the move (docker buildx
  # imagetools create by digest, so latest and the version tag are one
  # digest and the cosign signature and SBOM attestation verify for both)
  # and the post-publish check live there, where
  # scripts/tests/release-moves-latest.test.sh drives them against stand-in
  # gh and docker.
  #
  # Least privilege. packages: write is the whole reason these are jobs of
  # their own and not steps of `publish`: moving a tag needs to push to the
  # registry and nothing else. No id-token (nothing is signed here; the
  # signature is already on the digest) and no contents: write (nothing is
  # released here). contents: read is for the checkout and for reading the
  # release list.
  #
  # The version reaches the shell through env, never through a ${{ }}
  # expansion in the script, for the reason `publish`'s confirmation step
  # spells out.

  # After the image is built, pushed, signed and attested. A failure here
  # leaves the release published and the run red, which is the point: the
  # tag not following is something to see, not to discover later.
  tag-latest:
    name: move the latest tag to this release
    needs: [decide, publish]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the tag canonical.json declares
        id: tag
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("distribution/packaging/canonical.json"))["image"]["tag"])')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this the highest published release
        id: rule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          verdict="$(bash scripts/release/latest.sh should-be-latest "$TAG")"
          echo "latest=${verdict}" >> "$GITHUB_OUTPUT"
          echo "${TAG} takes latest: ${verdict}" >> "$GITHUB_STEP_SUMMARY"

      - name: Move latest to this release's index digest
        if: steps.rule.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/latest.sh move "$TAG"

      - name: Check latest resolves to this release's digest
        if: steps.rule.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/latest.sh verify "$TAG"

  # The backfill: workflow_dispatch with tag_latest_for=<version>, which
  # also covers a release cut before this existed. Nothing is built. Run it
  # from the ref that records the version in container/release-manifest.json
  # (main, once the release has merged back), because that file is what the
  # registry's digest is checked against.
  repoint-latest:
    name: re-point latest at a published release
    needs: decide
    if: needs.decide.outputs.repoint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-point latest, refusing anything the manifest does not describe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag_latest_for }}
        run: bash scripts/release/latest.sh repoint "$VERSION"

      - name: Check latest resolves to that release's digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.tag_latest_for }}
        run: bash scripts/release/latest.sh verify "$VERSION"

  # ---- the GitHub Release (issue #1078) ---------------------------------
  #
  # Three jobs that run only after `publish` has pushed, signed and attested
  # the image, and only when this run publishes. They add CLI tarballs to a
  # GitHub Release; they change nothing about the image or its signature.
  #
  # None of them holds id-token. The signing identity is `publish`'s alone,
  # and the tarballs are checksummed (SHA256SUMS) and NOT signed:
  # docs/compliance/release-provenance.md says so in the same words. The
  # trigger above is untouched, so the identity a verifier pins is too.
  cli-binaries:
    name: build the CLI tarballs
    needs: [decide, publish]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the tag canonical.json declares
        id: tag
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("distribution/packaging/canonical.json"))["image"]["tag"])')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build linux and darwin, amd64 and arm64
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/release/build-cli-tarballs.sh "$TAG" "$GITHUB_SHA" dist-cli

      - name: Upload the tarballs
        uses: actions/upload-artifact@v7
        with:
          name: cli-tarballs
          path: |
            dist-cli/*.tar.gz
            dist-cli/SHA256SUMS
          if-no-files-found: error

  # A darwin binary that builds on Linux can still fail to start on a Mac.
  # This runs the arm64 tarball on a hosted macOS runner before anything is
  # attached to a release.
  cli-darwin-smoke:
    name: run the macOS tarball on macOS
    needs: [decide, cli-binaries]
    if: needs.decide.outputs.publish == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download the tarballs
        uses: actions/download-artifact@v8
        with:
          name: cli-tarballs
          path: dist-cli

      - name: Check the sum, unpack and run it
        env:
          TAG: ${{ needs.cli-binaries.outputs.tag }}
        run: |
          cd dist-cli
          shasum -a 256 -c --ignore-missing SHA256SUMS
          tar -xzf "retnd_${TAG}_darwin_arm64.tar.gz"
          out="$(./retnd version)"
          echo "$out"
          case "$out" in
            *"${TAG}"*) ;;
            *) echo "::error::retnd version did not report ${TAG}"; exit 1 ;;
          esac

  github-release:
    name: create the GitHub Release
    needs: [decide, cli-binaries, cli-darwin-smoke]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the tarballs
        uses: actions/download-artifact@v8
        with:
          name: cli-tarballs
          path: dist-cli

      # One versioned release per package version, kept in step with the
      # package. A publish of a new version creates v<version>. A publish of
      # a version that already has a release (a re-run, or a push that
      # rebuilds the image under the same tag) refreshes it, because
      # creating it a second time would fail on the existing tag and leave a
      # release whose tarballs no longer match the image beside it (#1102).
      # The local-gate log travels with the release (#1260). The record
      # require-release-gate read carries the log's hash, and a hash that
      # points at nothing a reader can download is not much of a record,
      # so the log is attached beside the tarballs as local-gate.log. It is
      # not in SHA256SUMS, which covers the four tarballs; the record in
      # the published commit is what pins it. An overridden release may
      # have no log, and then nothing is attached and the notes say so.
      - name: Create or refresh the release and attach the tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.cli-binaries.outputs.tag }}
        run: |
          notes="retnd ${TAG}. The container image is ghcr.io/retnd/retnd:${TAG}, published at https://github.com/retnd/retnd/pkgs/container/retnd and signed with cosign (see docs/compliance/release-provenance.md). The tarballs below are checksummed in SHA256SUMS and are not signed."
          assets="dist-cli/*.tar.gz dist-cli/SHA256SUMS"
          if [ -f provenance/local-gate.log ]; then
            cp provenance/local-gate.log dist-cli/local-gate.log
            assets="${assets} dist-cli/local-gate.log"
            notes="${notes} local-gate.log is the output of the full local gate run recorded for this tree in provenance/local-gate.json."
          else
            notes="${notes} No local-gate log is attached: the published commit carries no provenance/local-gate.log, so this release went out on a Release-Gate-Override."
          fi
          # The release page's "Latest" badge follows the same rule as the
          # image's latest tag (#1168): the highest non-prerelease release
          # wins, so a backport or a prerelease is created with
          # --latest=false and never takes the badge from a newer release.
          if [ "$(bash scripts/release/latest.sh should-be-latest "$TAG")" = true ]; then
            latest_flag="--latest"
          else
            latest_flag="--latest=false"
          fi
          if gh release view "v${TAG}" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "v${TAG}" $assets --clobber
            gh release edit "v${TAG}" --title "retnd ${TAG}" --notes "$notes" "$latest_flag"
            echo "Refreshed the existing release v${TAG} (${latest_flag})." >> "$GITHUB_STEP_SUMMARY"
          else
            # shellcheck disable=SC2086
            gh release create "v${TAG}" $assets \
              --target "$GITHUB_SHA" \
              --title "retnd ${TAG}" \
              --notes "$notes" \
              "$latest_flag"
            echo "Created release v${TAG} (${latest_flag})." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Package: https://github.com/retnd/retnd/pkgs/container/retnd" >> "$GITHUB_STEP_SUMMARY"
