# The browser end-to-end suite, on demand.
#
# WHERE THE SUITE IS NOW. It is not in this repository. Issue #158 moved it
# to retnd/retnd-tests as Suite B, pinned here by
# scripts/e2e/tests-repo.pin, and this workflow checks that repository out
# at the pinned sha and runs it against this repository's ui/shared.
#
# WHERE THE GATE IS. Also not here. This workflow triggers on nothing, so
# a required check on it would gate nothing. The blocking signal is
# scripts/ci-local.sh, via .husky/pre-commit, which runs the same Suite B
# on every non-FAST commit plus a CLI smoke slice, both against the
# working tree (#197). This workflow exists for the case that gate cannot
# serve: a run on a clean machine, on demand, with a trace to download
# afterwards, including the seven-provider matrix the local gate
# deliberately leaves out.
#
# ci.yml is gone (#1260): the pre-commit gate is the only gate, and the
# release is refused unless a full run of it is recorded on the tree being
# published. Suite B is in that run already, against the working tree, so
# this file stays what it was: a run on a clean machine with a trace, on
# demand, and not a gate.
#
# The schedule stays commented. Re-enabling it would reintroduce the flake
# noise this workflow's own history argues against, and it is no longer the
# only thing standing between a red spec and a merge, which is what made
# the argument close before. Turning it on is the owner's call.

name: Nightly E2E

on:
  # schedule:
  #   # 03:20 UTC, chosen to sit clear of the estate's other nightly jobs.
  #   - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: playwright (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: generic
            script: e2e
          - suite: all-providers
            script: "e2e:all-providers"
    steps:
      - name: Checkout the product
        uses: actions/checkout@v7
        with:
          path: product

      # The pin, not a branch. What this job runs has to be the same thing
      # the local gate runs, or a green here would say nothing about a
      # commit the gate refused.
      - name: Read the pinned tests-repo sha
        id: pin
        working-directory: product
        run: |
          . scripts/e2e/tests-repo.pin
          echo "url=$TESTS_REPO_URL" >>"$GITHUB_OUTPUT"
          echo "sha=$TESTS_REPO_SHA" >>"$GITHUB_OUTPUT"

      - name: Checkout the tests repository at the pin
        uses: actions/checkout@v7
        with:
          repository: retnd/retnd-tests
          ref: ${{ steps.pin.outputs.sha }}
          path: tests
          token: ${{ secrets.TESTS_REPO_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The app under test is this repository's ui/shared, so its own
      # dependencies are what the dev server runs.
      - name: Install the app under test
        working-directory: product/ui/shared
        run: npm ci --no-audit --no-fund

      - name: Install the suite
        working-directory: tests/suites/web-ui
        run: npm ci --no-audit --no-fund

      # Only the browsers the config actually uses, with their system deps.
      - name: Install Playwright browsers
        working-directory: tests/suites/web-ui
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.suite }}
        working-directory: tests/suites/web-ui
        env:
          RETND_UI_DIR: ${{ github.workspace }}/product/ui/shared
        run: npm run ${{ matrix.script }}

      # A failed browser run is close to unusable without the trace, and the
      # person reading it is doing so with no way to reproduce the runner's
      # state.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            tests/suites/web-ui/playwright-report/
            tests/suites/web-ui/test-results/
          retention-days: 14
          if-no-files-found: ignore
